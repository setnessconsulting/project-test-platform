[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-test-platform"
version = "0.1.0.dev0"
description = "Portfolio-wide behavioral verification, quality evidence, and CI placement platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Setness Consulting" }]
dependencies = [
  "pydantic>=2.13.4,<2.14",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "jsonschema>=4.26.0,<4.27",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[project.scripts]
test-platform = "test_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src/test_platform"]
