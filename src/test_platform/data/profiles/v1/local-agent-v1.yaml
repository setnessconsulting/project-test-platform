schema_version: "1"
profile_id: local-agent-v1
version: 1.0.0
allowed_trust: [pr-untrusted, trusted-branch, trusted-manual, live-qualification]
recommended_execution: [local, jenkins]
live_evidence_max_age_days: 30
critical_journey_e2e_required: true
mutation_analysis: conditional
requirements:
  - rule_id: static-verification
    evidence_class: static
    level: required
    non_waivable: true
    description: Package, lint, type, and configuration checks must pass.
  - rule_id: deterministic-policy
    evidence_class: deterministic
    level: required
    description: Routing, policy, queue, and state behavior require deterministic evidence.
  - rule_id: local-workflow-integration
    evidence_class: integration
    level: required
    description: Filesystem, process, and adapter boundaries require integration evidence.
  - rule_id: owner-critical-flow
    evidence_class: end-to-end
    level: required
    non_waivable: true
    description: The declared owner-triggered critical workflow requires assembled end-to-end proof.
  - rule_id: adversarial-local-boundaries
    evidence_class: adversarial-security
    level: required
    non_waivable: true
    description: Command, path, prompt, credential, and isolation boundaries require negative evidence.
  - rule_id: live-integration-qualification
    evidence_class: live-qualification
    level: conditional
    description: Real external integration claims require bounded live qualification.
