schema_version: "1"
profile:
  profile_id: infrastructure-tool-v1
  version: 1.0.0
behaviors_path: quality/behaviors.yaml
suites:
  - suite_id: verify
    entrypoint: verify
    trust: pr-untrusted
    timeout_seconds: 900
    evidence_classes: [static, deterministic, integration, adversarial-security]
  - suite_id: qualify
    entrypoint: qualify:live
    trust: live-qualification
    timeout_seconds: 1800
    evidence_classes: [live-qualification]
